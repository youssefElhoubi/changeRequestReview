<section
  class="rounded-panel border border-line bg-surface p-6 shadow-surface sm:p-8"
  [attr.aria-busy]="actionInFlight"
>
  <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-start">
    <div>
      <h2 class="text-lg font-semibold text-ink">Review decision</h2>
      <p class="mt-1 text-sm text-muted">
        Confirm the proposed change or return it with a clear reason.
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-3">
      <button
        type="button"
        data-testid="approve-btn"
        class="inline-flex items-center justify-center gap-2 rounded-control bg-success-600 px-5 py-2.5 text-sm font-semibold text-white shadow-surface transition duration-standard hover:bg-success-700 focus:outline-none focus:ring-2 focus:ring-success-600/20 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="!canApprove || actionInFlight"
        (click)="onApprove()"
      >
        <svg
          *ngIf="actionInFlight"
          class="h-4 w-4 animate-spin text-white"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
          ></path>
        </svg>
        <span>{{ actionInFlight ? "Saving..." : "Approve" }}</span>
      </button>
      <button
        type="button"
        data-testid="reject-btn"
        class="inline-flex items-center justify-center gap-2 rounded-control border border-danger-600 bg-surface px-5 py-2.5 text-sm font-semibold text-danger-700 shadow-surface transition duration-standard hover:bg-danger-50 focus:outline-none focus:ring-2 focus:ring-danger-600/20 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="!canReject || actionInFlight"
        (click)="onReject()"
      >
        Reject
      </button>
    </div>
  </div>

  <div class="mt-6 border-t border-line pt-5">
    <label class="block text-sm font-semibold text-ink" for="reject-reason">
      Rejection reason
    </label>
    <p class="mt-1 text-xs text-muted">
      A note explaining the decision is required when rejecting a change request.
    </p>
    <textarea
      id="reject-reason"
      data-testid="reject-reason"
      class="mt-2 w-full rounded-control border border-line bg-surface p-3.5 text-sm text-ink shadow-surface outline-none transition duration-standard placeholder:text-muted focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 disabled:cursor-not-allowed disabled:bg-canvas"
      rows="3"
      [(ngModel)]="reason"
      [disabled]="!canReject || actionInFlight"
      placeholder="State the reason why this request is being returned for revision..."
    ></textarea>
    <p
      *ngIf="validationMessage"
      class="mt-1.5 text-xs font-medium text-danger-700"
      role="alert"
    >
      {{ validationMessage }}
    </p>
  </div>
</section>
