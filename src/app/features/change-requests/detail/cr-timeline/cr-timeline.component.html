<section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
  <h2 class="text-xl font-semibold text-slate-900">Approval timeline</h2>
  <ol class="mt-4 space-y-4">
    <li
      *ngFor="let event of chronologicalEvents; trackBy: trackById"
      data-testid="timeline-event"
      class="border-l-2 border-indigo-200 pl-4"
    >
      <p class="font-semibold capitalize text-slate-900">{{ event.type }}</p>
      <p class="text-sm text-slate-600">
        {{ event.actor.name }} · {{ event.at | date: "medium" }}
      </p>
      <p *ngIf="event.note" class="mt-1 text-sm text-slate-700">
        {{ event.note }}
      </p>
    </li>
  </ol>
</section>
