<section class="rounded-panel border border-line bg-surface p-6 shadow-surface">
  <h2 class="text-lg font-semibold text-ink">Approval timeline</h2>
  <p class="mt-1 text-sm text-muted">
    A chronological record of activity on this request.
  </p>
  <ol class="mt-4 space-y-4">
    <li
      *ngFor="let event of chronologicalEvents; trackBy: trackById"
      data-testid="timeline-event"
      class="border-l-2 border-brand-100 pl-4"
    >
      <p class="font-semibold capitalize text-ink">{{ event.type }}</p>
      <p class="text-sm text-muted">
        {{ event.actor.name }} · {{ event.at | date: "medium" }}
      </p>
      <p *ngIf="event.note" class="mt-1 text-sm leading-6 text-ink">
        {{ event.note }}
      </p>
    </li>
  </ol>
</section>
