<main
  class="mx-auto max-w-6xl space-y-6 px-4 py-8 sm:px-6 lg:px-8"
  aria-live="polite"
>
  <header class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
    <div>
      <p class="text-sm font-semibold uppercase tracking-wide text-indigo-600">
        Your workspace
      </p>
      <h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-900">
        My requests
      </h1>
    </div>

    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      <span>Status filter</span>
      <select
        data-testid="my-requests-status-filter"
        class="rounded-md border border-slate-300 bg-white px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        [value]="statusFilter"
        (change)="onStatusFilterEvent($event)"
        aria-label="Filter your requests by status"
      >
        <option value="">All statuses</option>
        <option *ngFor="let status of statuses" [value]="status">
          {{ formatStatus(status) }}
        </option>
      </select>
    </label>
  </header>

  <ng-container *ngIf="vm$ | async as vm">
    <section
      *ngIf="vm.state === 'loading'"
      class="rounded-lg border border-slate-200 bg-white p-8 text-center"
      aria-busy="true"
    >
      <div class="flex items-center justify-center gap-3 text-slate-600">
        <svg
          class="h-6 w-6 animate-spin text-indigo-600"
          viewBox="0 0 24 24"
          fill="none"
          role="status"
          aria-label="Loading your requests"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
          ></path>
        </svg>
        <span>Loading your requests...</span>
      </div>
    </section>

    <section
      *ngIf="vm.state === 'error'"
      class="rounded-lg border border-rose-200 bg-rose-50 p-6 text-rose-800"
      role="alert"
    >
      {{ vm.errorMessage }}
    </section>

    <section
      *ngIf="vm.state === 'empty'"
      class="rounded-lg border border-slate-200 bg-white p-8 text-center"
    >
      <h2 class="text-lg font-semibold text-slate-900">No requests yet</h2>
      <p class="mt-1 text-slate-600">
        You haven't submitted any change requests.
      </p>
    </section>

    <ng-container *ngIf="vm.state === 'loaded'">
      <section
        *ngIf="visibleRows.length === 0"
        class="rounded-lg border border-slate-200 bg-white p-8 text-center"
      >
        <h2 class="text-lg font-semibold text-slate-900">
          No matching requests
        </h2>
        <p class="mt-1 text-slate-600">Try selecting a different status.</p>
      </section>

      <app-cr-table
        *ngIf="visibleRows.length > 0"
        [rows]="visibleRows"
        (rowClick)="onRowClick($event)"
      ></app-cr-table>
    </ng-container>
  </ng-container>
</main>
