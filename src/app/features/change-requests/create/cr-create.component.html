<main
  class="mx-auto max-w-6xl space-y-6 px-4 py-8 sm:px-6 lg:px-8"
  aria-live="polite"
>
  <header>
    <p class="text-sm font-semibold uppercase tracking-wide text-indigo-600">
      New request
    </p>
    <h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-900">
      Create change request
    </h1>
  </header>

  <div
    *ngIf="errorMessage"
    class="rounded-lg border border-rose-200 bg-rose-50 p-4 text-rose-800"
    role="alert"
  >
    {{ errorMessage }}
  </div>

  <form
    class="space-y-6 rounded-lg border border-slate-200 bg-white p-6 shadow-sm"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <div>
      <label
        for="cr-title"
        class="block text-sm font-medium text-slate-700"
      >
        Title
      </label>
      <input
        id="cr-title"
        formControlName="title"
        type="text"
        class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        placeholder="Brief summary of the change"
      />
      <p
        *ngIf="form.get('title')?.touched && form.get('title')?.hasError('required')"
        class="mt-1 text-sm text-rose-700"
      >
        Title is required.
      </p>
    </div>

    <div>
      <label
        for="cr-description"
        class="block text-sm font-medium text-slate-700"
      >
        Description
      </label>
      <textarea
        id="cr-description"
        formControlName="description"
        rows="3"
        class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        placeholder="Describe the requested change in detail"
      ></textarea>
      <p
        *ngIf="form.get('description')?.touched && form.get('description')?.hasError('required')"
        class="mt-1 text-sm text-rose-700"
      >
        Description is required.
      </p>
    </div>

    <fieldset>
      <legend class="text-sm font-medium text-slate-700">Data changes</legend>
      <div
        formArrayName="changes"
        class="mt-3 space-y-4"
      >
        <div
          *ngFor="let change of changes.controls; let i = index"
          [formGroupName]="i"
          class="flex flex-col gap-3 rounded-md border border-slate-200 bg-slate-50 p-4 sm:flex-row sm:items-start"
        >
          <div class="flex-1">
            <label
              [for]="'field-' + i"
              class="block text-xs font-medium text-slate-600"
            >
              Field name
            </label>
            <input
              [id]="'field-' + i"
              formControlName="field"
              type="text"
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
              placeholder="e.g. Marketing budget"
            />
            <p
              *ngIf="change.get('field')?.touched && change.get('field')?.hasError('required')"
              class="mt-1 text-xs text-rose-700"
            >
              Field name is required.
            </p>
          </div>
          <div class="flex-1">
            <label
              [for]="'before-' + i"
              class="block text-xs font-medium text-slate-600"
            >
              Before
            </label>
            <input
              [id]="'before-' + i"
              formControlName="before"
              type="text"
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
              placeholder="Current value"
            />
          </div>
          <div class="flex-1">
            <label
              [for]="'after-' + i"
              class="block text-xs font-medium text-slate-600"
            >
              After
            </label>
            <input
              [id]="'after-' + i"
              formControlName="after"
              type="text"
              class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
              placeholder="Requested value"
            />
          </div>
          <button
            type="button"
            class="self-end rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 sm:self-center sm:mt-5"
            [disabled]="changes.length <= 1"
            (click)="removeChange(i)"
          >
            Remove
          </button>
        </div>
      </div>
      <button
        type="button"
        class="mt-3 rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50"
        (click)="addChange()"
      >
        + Add change
      </button>
    </fieldset>

    <div class="flex gap-3 border-t border-slate-200 pt-4">
      <button
        type="submit"
        data-testid="submit-cr-btn"
        class="rounded-md bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="(state$ | async) === 'loading'"
      >
        {{ (state$ | async) === 'loading' ? 'Creating...' : 'Create request' }}
      </button>
      <button
        type="button"
        class="rounded-md border border-slate-300 px-4 py-2 font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50"
        (click)="cancel()"
        [disabled]="(state$ | async) === 'loading'"
      >
        Cancel
      </button>
    </div>
  </form>
</main>
