<main class="mx-auto max-w-xl px-4 py-8 sm:px-6" aria-live="polite">
  <header class="mb-6">
    <p class="text-sm font-semibold uppercase tracking-wide text-indigo-600">
      User management
    </p>
    <h1 class="mt-1 text-3xl font-bold text-slate-900">Create user</h1>
  </header>

  <form
    class="space-y-5 rounded-lg border border-slate-200 bg-white p-6 shadow-sm"
    [formGroup]="form"
    (ngSubmit)="submit()"
    aria-label="Create user"
  >
    <div>
      <label class="block text-sm font-medium text-slate-700" for="user-name">
        Name
      </label>
      <input
        id="user-name"
        class="mt-1 w-full rounded-md border border-slate-300 p-2"
        formControlName="name"
        autocomplete="name"
      />
      <p
        *ngIf="form.controls.name.touched && form.controls.name.invalid"
        class="mt-1 text-sm text-rose-700"
        role="alert"
      >
        Name is required.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700" for="user-email">
        Email
      </label>
      <input
        id="user-email"
        class="mt-1 w-full rounded-md border border-slate-300 p-2"
        formControlName="email"
        type="email"
        autocomplete="email"
      />
      <p
        *ngIf="form.controls.email.touched && form.controls.email.invalid"
        class="mt-1 text-sm text-rose-700"
        role="alert"
      >
        Enter a valid email address.
      </p>
    </div>

    <div>
      <label
        class="block text-sm font-medium text-slate-700"
        for="user-password"
      >
        Password
      </label>
      <input
        id="user-password"
        class="mt-1 w-full rounded-md border border-slate-300 p-2"
        formControlName="password"
        type="password"
        autocomplete="new-password"
      />
      <p class="mt-1 text-xs text-slate-600">
        Use at least 8 characters with uppercase, lowercase, and a number.
      </p>
    </div>

    <ng-container *ngIf="creationState$ | async as state">
      <p *ngIf="state.status === 'loading'" aria-busy="true">
        Creating user...
      </p>
      <p
        *ngIf="state.status === 'success'"
        class="text-emerald-700"
        role="status"
      >
        User created successfully.
      </p>
      <p *ngIf="state.status === 'error'" class="text-rose-700" role="alert">
        {{ state.error?.message }}
      </p>
    </ng-container>

    <div class="flex gap-3">
      <button
        type="submit"
        class="rounded-md bg-indigo-600 px-4 py-2 font-semibold text-white disabled:opacity-50"
        [disabled]="form.disabled"
      >
        Create user
      </button>
      <button
        type="button"
        class="rounded-md border border-slate-300 px-4 py-2"
        [disabled]="form.disabled"
        (click)="cancel()"
      >
        Cancel
      </button>
    </div>
  </form>
</main>
