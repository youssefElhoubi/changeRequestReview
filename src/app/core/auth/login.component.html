<main class="mx-auto max-w-md px-4 py-8 sm:px-6" aria-live="polite">
  <header class="mb-6">
    <p class="text-sm font-semibold uppercase tracking-wide text-indigo-600">
      Change request review
    </p>
    <h1 class="mt-1 text-3xl font-bold text-slate-900">Sign in</h1>
  </header>

  <form
    class="space-y-5 rounded-lg border border-slate-200 bg-white p-6 shadow-sm"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <div>
      <label class="block text-sm font-medium text-slate-700" for="login-email">
        Email
      </label>
      <input
        id="login-email"
        class="mt-1 w-full rounded-md border border-slate-300 p-2"
        formControlName="email"
        type="email"
        autocomplete="email"
      />
    </div>

    <div>
      <label
        class="block text-sm font-medium text-slate-700"
        for="login-password"
      >
        Password
      </label>
      <input
        id="login-password"
        class="mt-1 w-full rounded-md border border-slate-300 p-2"
        formControlName="password"
        type="password"
        autocomplete="current-password"
      />
    </div>

    <ng-container *ngIf="authState$ | async as state">
      <p *ngIf="state.status === 'loading'" aria-busy="true">Signing in...</p>
      <p *ngIf="state.status === 'error'" class="text-rose-700" role="alert">
        {{ state.error?.message }}
      </p>
    </ng-container>

    <button
      type="submit"
      class="w-full rounded-md bg-indigo-600 px-4 py-2 font-semibold text-white disabled:opacity-50"
      [disabled]="form.disabled"
    >
      Sign in
    </button>
  </form>
</main>
