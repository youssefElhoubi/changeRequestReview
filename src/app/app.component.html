<ng-container *ngIf="authState$ | async as authState">
  <main
    *ngIf="authState.status === 'loading'; else applicationContent"
    class="flex min-h-screen items-center justify-center bg-canvas px-4"
    aria-busy="true"
    aria-live="polite"
  >
    <div
      class="flex items-center gap-3 rounded-panel border border-line bg-surface px-5 py-4 text-sm font-medium text-muted shadow-surface"
      role="status"
    >
      <svg
        class="h-5 w-5 animate-spin text-brand-600"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
        ></path>
      </svg>
      <span>Restoring your session...</span>
    </div>
  </main>

  <ng-template #applicationContent>
    <div
      *ngIf="authState.status === 'authenticated' && authState.user as user"
      class="app-shell"
    >
      <button
        *ngIf="isNavigationOpen"
        type="button"
        class="app-sidebar-backdrop"
        aria-label="Close navigation"
        (click)="closeNavigation()"
      ></button>

      <aside
        class="app-sidebar flex flex-col p-4 sm:p-5"
        [class.is-open]="isNavigationOpen"
      >
        <a
          routerLink="/change-requests"
          class="app-wordmark mb-6 flex items-center gap-2.5 text-sm font-semibold tracking-tight text-ink"
          (click)="closeNavigation()"
        >
          <span
            class="flex h-8 w-8 items-center justify-center rounded-control bg-brand-600 text-xs font-bold text-white shadow-sm"
          >
            CR
          </span>
          <div class="flex flex-col">
            <span class="text-sm font-bold text-ink leading-tight">Change Review</span>
            <span class="text-[10px] uppercase tracking-wider font-semibold text-brand-600">Workspace</span>
          </div>
        </a>

        <div class="mb-2 px-3 text-[11px] font-semibold uppercase tracking-wider text-muted">
          Navigation
        </div>

        <nav
          id="authenticated-navigation"
          class="flex flex-1 flex-col gap-1 text-sm"
          aria-label="Authenticated navigation"
        >
          <a
            *ngIf="user.permissions.includes(viewPermission)"
            routerLink="/change-requests"
            routerLinkActive="bg-brand-50 font-semibold text-brand-700 shadow-sm"
            [routerLinkActiveOptions]="{ exact: true }"
            class="app-nav-link rounded-control px-3 py-2 text-muted transition duration-standard hover:bg-canvas hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
            (click)="closeNavigation()"
          >
            <svg
              class="app-nav-icon"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M3 4.5h14M3 10h14M3 15.5h14"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
            Change requests
          </a>
          <a
            *ngIf="canCreateRequests(authState)"
            routerLink="/change-requests/create"
            routerLinkActive="bg-brand-50 font-semibold text-brand-700 shadow-sm"
            class="app-nav-link rounded-control px-3 py-2 text-muted transition duration-standard hover:bg-canvas hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
            (click)="closeNavigation()"
          >
            <svg
              class="app-nav-icon"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M10 4v12M4 10h12"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
            New request
          </a>
          <a
            *ngIf="canCreateRequests(authState)"
            routerLink="/change-requests/my-requests"
            routerLinkActive="bg-brand-50 font-semibold text-brand-700 shadow-sm"
            class="app-nav-link rounded-control px-3 py-2 text-muted transition duration-standard hover:bg-canvas hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
            (click)="closeNavigation()"
          >
            <svg
              class="app-nav-icon"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M10 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM4 16.5a6 6 0 0 1 12 0"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
            My requests
          </a>
          <a
            *ngIf="canCreateUsers(authState)"
            routerLink="/users/create"
            routerLinkActive="bg-brand-50 font-semibold text-brand-700 shadow-sm"
            class="app-nav-link rounded-control px-3 py-2 text-muted transition duration-standard hover:bg-canvas hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
            (click)="closeNavigation()"
          >
            <svg
              class="app-nav-icon"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M10 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM4 16.5a6 6 0 0 1 12 0ZM15 5v4M13 7h4"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Create user
          </a>
        </nav>

        <div class="mt-auto border-t border-line pt-4">
          <div class="flex items-center gap-3 px-2 py-1">
            <span class="app-user-avatar" aria-hidden="true">
              {{ user.name.charAt(0).toUpperCase() }}
            </span>
            <div class="min-w-0 flex-1">
              <p class="truncate text-xs font-semibold text-ink">{{ user.name }}</p>
              <p class="truncate text-[11px] capitalize text-muted">{{ user.role }}</p>
            </div>
          </div>
        </div>
      </aside>

      <main class="app-content">
        <header class="app-header">
          <div class="flex min-w-0 items-center gap-3">
            <button
              type="button"
              class="app-menu-button rounded-control border border-line p-2 text-muted transition duration-standard hover:border-brand-500 hover:bg-brand-50 hover:text-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20"
              [attr.aria-expanded]="isNavigationOpen"
              aria-controls="authenticated-navigation"
              aria-label="Toggle navigation"
              (click)="toggleNavigation()"
            >
              <svg
                class="h-5 w-5"
                viewBox="0 0 20 20"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M3 4.5h14M3 10h14M3 15.5h14"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <div class="min-w-0">
              <p
                class="text-xs font-semibold uppercase tracking-wider text-muted"
              >
                Workspace
              </p>
              <h1 class="truncate text-base font-semibold text-ink">
                {{ currentPageContext() }}
              </h1>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="hidden text-right text-sm sm:block">
              <span class="block text-xs text-muted">
                Signed in as
                <strong class="font-semibold text-ink">{{ user.name }}</strong>
              </span>
            </span>
            <span class="app-user-avatar" aria-hidden="true">
              {{ user.name.charAt(0).toUpperCase() }}
            </span>
            <button
              type="button"
              class="app-logout-button inline-flex items-center rounded-control border border-line bg-surface px-3 py-1.5 text-xs font-semibold text-muted shadow-surface transition duration-standard hover:border-danger-600/30 hover:bg-danger-50 hover:text-danger-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20"
              (click)="logout()"
            >
              Log out
            </button>
          </div>
        </header>
        <router-outlet></router-outlet>
      </main>
    </div>

    <router-outlet *ngIf="authState.status !== 'authenticated'"></router-outlet>
  </ng-template>
</ng-container>
