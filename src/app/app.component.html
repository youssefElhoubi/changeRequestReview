<ng-container *ngIf="authState$ | async as authState">
  <main
    *ngIf="authState.status === 'loading'; else applicationContent"
    class="flex min-h-screen items-center justify-center bg-slate-50 px-4"
    aria-busy="true"
    aria-live="polite"
  >
    <div
      class="flex items-center gap-3 rounded-lg border border-slate-200 bg-white px-5 py-4 text-sm font-medium text-slate-700 shadow-sm"
      role="status"
    >
      <svg
        class="h-5 w-5 animate-spin text-indigo-600"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
        ></path>
      </svg>
      <span>Restoring your session...</span>
    </div>
  </main>

  <ng-template #applicationContent>
    <header
      *ngIf="authState.status === 'authenticated' && authState.user as user"
      class="border-b border-slate-200 bg-white"
    >
      <div
        class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8"
      >
        <a
          routerLink="/change-requests"
          class="text-sm font-semibold uppercase tracking-wide text-indigo-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
        >
          Change request review
        </a>

        <nav
          class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm"
          aria-label="Authenticated navigation"
        >
          <a
            *ngIf="user.permissions.includes(viewPermission)"
            routerLink="/change-requests"
            routerLinkActive="font-semibold text-slate-900"
            [routerLinkActiveOptions]="{ exact: true }"
            class="text-slate-600 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
          >
            Change requests
          </a>
          <a
            *ngIf="canCreateRequests(authState)"
            routerLink="/change-requests/create"
            routerLinkActive="font-semibold text-slate-900"
            class="text-slate-600 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
          >
            New request
          </a>
          <a
            *ngIf="canCreateRequests(authState)"
            routerLink="/change-requests/my-requests"
            routerLinkActive="font-semibold text-slate-900"
            class="text-slate-600 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
          >
            My requests
          </a>
          <a
            *ngIf="canCreateUsers(authState)"
            routerLink="/users/create"
            routerLinkActive="font-semibold text-slate-900"
            class="text-slate-600 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
          >
            Create user
          </a>
          <span class="border-l border-slate-200 pl-4 text-slate-600">
            Signed in as
            <strong class="font-semibold text-slate-900">{{
              user.name
            }}</strong>
          </span>
          <button
            type="button"
            class="rounded-md border border-slate-300 px-3 py-1.5 font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
            (click)="logout()"
          >
            Log out
          </button>
        </nav>
      </div>
    </header>

    <router-outlet></router-outlet>
  </ng-template>
</ng-container>
